name: OBI Browser Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          python -m playwright install chromium

      - name: Run Browser Probe
        run: |
          python -m tracker.devtools.obi_browser_probe

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obi-browser-probe
          path: |
            tracker/devtools/logs/*.txt
            tracker/devtools/logs/*.png
