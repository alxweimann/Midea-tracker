name: Midea PortaSplit Verfügbarkeit

on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Check-Modus"
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - slow
          - all

permissions:
  contents: write

concurrency:
  group: midea-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Playwright Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Chromium für Browser-Fallback installieren
        run: python -m playwright install chromium

      - name: Verfügbarkeit prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ github.event.inputs.mode }}"
          elif [[ "${{ github.event.schedule }}" == "7 * * * *" ]]; then
            MODE="slow"
          else
            MODE="fast"
          fi

          python -m tracker.run --mode "$MODE"

      - name: State zurück committen
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update availability state [skip ci]"
            git push
          else
            echo "Kein State-Update."
          fi